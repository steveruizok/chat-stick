; Waveshare ESP32-S3-Touch-AMOLED-1.8 — voice assistant
;
; The board ships with two different AMOLED driver ICs. Pick the env that
; matches your panel (both build from the same source tree):
;   waveshare-v1  — original board, SH8601 panel
;   waveshare-v2  — V2 board, CO5300 panel
;
;   pio run -e waveshare-v2 -t upload     (or ./flash.sh waveshare-v2)
[platformio]
default_envs = waveshare-v2

[waveshare]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 1500000

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; ESP32-S3R8 has octal PSRAM and external QIO flash.
board_build.arduino.memory_type = qio_opi

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.5
    lewisxhe/XPowersLib@^0.3.3
    bblanchon/ArduinoJson@^7.0.0
    gilmaimon/ArduinoWebsockets@^0.5.4
    symlink://../common

build_flags =
    -Isrc
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DXPOWERS_CHIP_AXP2101
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; Original board: SH8601 AMOLED controller.
[env:waveshare-v1]
extends = waveshare
build_flags =
    ${waveshare.build_flags}
    -DWAVESHARE_PANEL_SH8601

; V2 board: CO5300 AMOLED controller.
[env:waveshare-v2]
extends = waveshare
build_flags =
    ${waveshare.build_flags}
    -DWAVESHARE_PANEL_CO5300
