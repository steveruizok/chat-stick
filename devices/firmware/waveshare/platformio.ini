; Waveshare ESP32-S3-Touch-AMOLED-1.8 — real-time voice assistant
[platformio]
default_envs = waveshare-esp32-s3-touch-amoled-1_8

[env:waveshare-esp32-s3-touch-amoled-1_8]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino
build_src_filter =
    +<*>
    -<game/>
monitor_speed = 115200
monitor_filters = time
upload_speed = 1500000

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; ESP32-S3R8 has octal PSRAM and external QIO flash.
board_build.arduino.memory_type = qio_opi

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.5
    lewisxhe/XPowersLib@^0.3.3
    bblanchon/ArduinoJson@^7.0.0
    gilmaimon/ArduinoWebsockets@^0.5.4
    symlink://../common

build_flags =
    -Isrc
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DXPOWERS_CHIP_AXP2101
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; Standalone motion game. This deliberately excludes the voice-assistant
; entry point and does not compile credentials, Wi-Fi, or cloud services.
[env:send-me-to-heaven]
extends = env:waveshare-esp32-s3-touch-amoled-1_8
build_src_filter =
    +<game/>
    +<hal/Board.cpp>
    +<ui/SmartBrickFont.cpp>
lib_deps =
    moononournation/GFX Library for Arduino@^1.6.5
    lewisxhe/XPowersLib@^0.3.3
build_flags =
    ${env:waveshare-esp32-s3-touch-amoled-1_8.build_flags}
    -I../common/src
    -DDEBUG_CONSOLE_ENABLED=1
