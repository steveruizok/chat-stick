; M5StickS3 — real-time voice assistant via Gemini Live API
[env:m5stick-s3]
platform = espressif32@6.13.0
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 1500000

; ESP32-S3-PICO-1 has octal PSRAM
board_build.arduino.memory_type = qio_opi

lib_deps =
    m5stack/M5Unified@0.2.25
    m5stack/M5GFX@0.2.32
    m5stack/M5PM1@1.0.7
    bblanchon/ArduinoJson@7.4.3
    gilmaimon/ArduinoWebsockets@0.5.4
    symlink://../common

; DeviceCapabilities uses aggregate default member initializers.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Isrc
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
