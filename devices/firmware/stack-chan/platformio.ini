; Stack-Chan — hardware bring-up and interaction scaffold
[platformio]
default_envs = stack-chan-native-camera

[env:stack-chan]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 1500000

; CoreS3 has quad PSRAM. The generic S3 octal setting boots, but cannot see
; this module's RAM.
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv

lib_deps =
    https://github.com/m5stack/StackChan-BSP.git#1.1.0

build_flags =
    -Isrc
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; Native CoreS3 camera build. The plain stack-chan environment remains as a
; camera-free recovery target.
[env:stack-chan-native-camera]
extends = env:stack-chan
build_flags =
    ${env:stack-chan.build_flags}
    -DSTACK_CHAN_ENABLE_CAMERA=1
    -Imanaged_components/espressif__esp_video/include
    -Imanaged_components/espressif__esp_cam_sensor/include
    -Imanaged_components/espressif__esp_sccb_intf/include
    -L.pio/build/stack-chan-native-camera/esp-idf/espressif__esp_video
    -L.pio/build/stack-chan-native-camera/esp-idf/espressif__esp_cam_sensor
    -L.pio/build/stack-chan-native-camera/esp-idf/espressif__esp_sccb_intf
    -Wl,--whole-archive
    -lespressif__esp_video
    -lespressif__esp_cam_sensor
    -lespressif__esp_sccb_intf
    -Wl,--no-whole-archive
    -Wl,-u,gc0308_detect
custom_sdkconfig = file://sdkconfig.native-camera
custom_component_add = espressif/esp_video @ 1.3.1
